name: Build and Push Container

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: forgejo.apps.home.tomaskral.eu
  IMAGE: ${{ forgejo.repository }}

jobs:
  build:
    runs-on: docker
    container:
      image: docker:cli
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        run: git clone --depth=1 --branch ${{ forgejo.ref_name }} ${{ forgejo.server_url }}/${{ forgejo.repository }} .

      - name: Login to Forgejo Container Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ forgejo.repository_owner }} --password-stdin

      - name: Build and push image
        run: >
          docker buildx build --push
          --label org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
          --label org.opencontainers.image.revision=${{ forgejo.sha }}
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ forgejo.sha }}
          .
